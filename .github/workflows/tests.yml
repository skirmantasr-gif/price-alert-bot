name: Tests

# Runs the automatic tests (tests/, no internet, no secrets) on every code upload. GitHub emails the owner if they
# fail. Independent of the bot: a failing test never stops the running bot. State saves ("[skip ci]") are skipped.
on:
  push:
    branches: [main]
    paths-ignore: ["state.enc", "**.md"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
