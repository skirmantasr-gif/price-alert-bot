name: Price alerts

on:
  schedule:
    - cron: "0 * * * *"     # every hour; at most one run active + one queued, so there's always a successor ready
  workflow_dispatch: {}      # "Run workflow" button for manual start

concurrency:
  group: price-alert-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.ref_name }}   # latest commit on the branch, so saved prices are picked up
          persist-credentials: false    # don't leave a repo-write token on disk for the bot / pip packages

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install Claude SDK (for AI impact predictions)
        continue-on-error: true   # optional; the bot falls back to keyword rules if this fails
        run: |   # exact, hash-checked versions only
          pip install --quiet --require-hashes --only-binary ":all:" -r requirements-ai.txt

      - name: Load saved state (encrypted, so the public repo doesn't show what's watched)
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}         # own random key for the saved state
          OLD_PASS: ${{ secrets.PRICEHINIO_ALERT }}   # bot token: the old key, still accepted when reading
        run: |
          [ -f state.enc ] || exit 0
          for K in STATE_KEY OLD_PASS; do
            [ -n "${!K}" ] || continue
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -pass "env:$K" -in state.enc -out state.json 2>/dev/null \
               && python3 -c "import json,sys; json.load(open('state.json'))" 2>/dev/null; then
              echo "Saved state loaded (key: $K)"; exit 0
            fi
          done
          echo "Saved state could not be decrypted (key changed?); starting fresh"; rm -f state.json

      - name: Watch prices + news (~5h45m)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PRICEHINIO_ALERT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}           # contact email the SEC requires; SEC filings off if unset
          NEWS: "true"                                       # news headlines + filings to the same channel
          NEWS_SECONDS: "60"                                 # SEC, Yahoo, FDA every minute; Google News every 5 min
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional; keyword rules are used if unset
          AI_MODEL: claude-haiku-5-5                         # or claude-opus-5-5 (smarter, ~20x the cost)
          WATCHLIST: ${{ secrets.WATCHLIST }}                # stocks, per-stock % steps, news settings (JSON, see watchlist.py)
          CONTRACTS: "true"                                  # contract wins by any small/mid cap, 15 markets (contracts.py)
          CONTRACTS_CHAT_ID: ${{ secrets.CONTRACTS_CHAT_ID }}  # optional separate channel; same channel if unset
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}               # Alpaca paper keys: Benzinga real-time news; off if unset
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          BUYOUT: ${{ secrets.BUYOUT }}                      # buyout watch: universe / exclusions / notes (JSON, see buyout.py)
          BUYOUT_CHAT_ID: ${{ secrets.BUYOUT_CHAT_ID }}      # separate channel for 🎯 buyout watch
          PAPER_CHAT_ID: ${{ secrets.PAPER_CHAT_ID }}        # separate channel for the 🧪 practice portfolio (optional)
          BUYOUT_REPORT_TIME: "17:00"                        # daily scan + table, local time (watchlist timezone)
          HEARTBEAT_ROLE: github                             # watchdog: GitHub and the phone check on each other
          POLL_SECONDS: "60"
          MAX_RUNTIME_SECONDS: "20700"
          STARTUP_MESSAGE: ${{ github.event_name == 'workflow_dispatch' }}
          STATE_FILE: state.json
        run: python bot.py

      - name: Save reference prices
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}   # only this step gets repo-write access
          STATE_KEY: ${{ secrets.STATE_KEY }}
          OLD_PASS: ${{ secrets.PRICEHINIO_ALERT }}
        run: |
          [ -f state.json ] || exit 0
          STATE_PASS="${STATE_KEY:-$OLD_PASS}"; export STATE_PASS   # new key once the secret exists
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -a -pass env:STATE_PASS -in state.json -out state.enc
          git config user.name "price-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.enc
          git rm --cached --quiet --ignore-unmatch state.json   # the old unencrypted file
          git diff --cached --quiet && exit 0
          git commit -m "Update state [skip ci]"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          rm -f state.json   # plain copy (already encrypted above); it blocked the rebase once and the state was lost
          for i in 1 2 3 4 5; do   # retry: code uploads during the run move main ahead
            git -c http.https://github.com/.extraheader="$AUTH" pull --rebase -X theirs origin "$GITHUB_REF_NAME" \
              && git -c http.https://github.com/.extraheader="$AUTH" push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::State could not be saved; the next run will repeat recent alerts"
          exit 1
