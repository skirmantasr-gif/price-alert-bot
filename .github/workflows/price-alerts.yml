name: Price alerts

on:
  schedule:
    - cron: "0 * * * *"     # every hour; at most one run active + one queued, so there's always a successor ready
  workflow_dispatch: {}      # "Run workflow" button for manual start

concurrency:
  group: price-alert-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest commit on the branch, so saved prices are picked up

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch prices (~5h45m)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PRICEHINIO_ALERT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKERS: GLXY,CHRS,CAPR,CRTO,KLAR,ZIM,ORCL,BZUN,DXYZ,MIST,IMRX,VRRM,SLS,VNDA
          THRESHOLD_PCT: "2"
          POLL_SECONDS: "60"
          MAX_RUNTIME_SECONDS: "20700"
          STARTUP_MESSAGE: ${{ github.event_name == 'workflow_dispatch' }}
          STATE_FILE: state.json
        run: python bot.py

      - name: Save reference prices
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "price-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update state [skip ci]"
          git pull --rebase -X theirs || true
          git push
