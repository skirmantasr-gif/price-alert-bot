name: Price alerts

on:
  schedule:
    - cron: "0 * * * *"     # every hour; at most one run active + one queued, so there's always a successor ready
  workflow_dispatch: {}      # "Run workflow" button for manual start

concurrency:
  group: price-alert-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.ref_name }}   # latest commit on the branch, so saved prices are picked up

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Watch prices + news + Substack chat (~5h45m)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PRICEHINIO_ALERT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBSTACK_COOKIE: ${{ secrets.SUBSTACK_COOKIE }}   # optional; forwarding is off if unset
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}           # contact email the SEC requires; SEC filings off if unset
          NEWS: "true"                                       # news headlines + filings to the same channel
          NEWS_SECONDS: "300"
          NEWS_IMPORTANT_ONLY: ""                            # e.g. "ORCL,KLAR" to get only 🚨 headlines for those
          TICKERS: GLXY,CHRS,CAPR,CRTO,KLAR,ZIM,ORCL,BZUN,DXYZ,MIST,IMRX,VRRM,SLS,VNDA
          THRESHOLD_PCT: "2"
          POLL_SECONDS: "60"
          MAX_RUNTIME_SECONDS: "20700"
          STARTUP_MESSAGE: ${{ github.event_name == 'workflow_dispatch' }}
          STATE_FILE: state.json
        run: python bot.py

      - name: Save reference prices
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "price-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update state [skip ci]"
          git pull --rebase -X theirs || true
          git push
